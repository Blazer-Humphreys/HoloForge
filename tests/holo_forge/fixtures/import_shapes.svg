<?xml version="1.0" encoding="UTF-8"?>
<!-- Holo Forge import test: a 40 x 30 rectangle, a radius-10 circle (inside a translated group)
     and one closed path of lines, a cubic bump (area 135) and a semicircle (radius 10).
     One user unit is 1 mm (the page is 120 mm wide over a 120-unit viewBox).
     Expected: 10 curves, 3 profiles of 1200, 100*pi and 935 + 50*pi square millimeters. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="90mm" viewBox="0 0 120 90">
  <rect x="0" y="0" width="40" height="30" fill="none" stroke="black"/>
  <g transform="translate(10 50)">
    <circle cx="10" cy="20" r="10" fill="none" stroke="black"/>
  </g>
  <path d="M 60 40 L 100 40 L 100 20 C 90 11 80 11 70 20 l -10 0 A 10 10 0 0 0 60 40 Z" fill="none" stroke="black"/>
</svg>
